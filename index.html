<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Animal Coloring Book</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    overflow: hidden;
}


/* =========================
   NATURE BACKGROUND
========================= */

.scene {
    position: fixed;
    inset: 0;
    z-index: -5;
    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #a9dff0 0%,
            #c9eee9 48%,
            #b7dfc2 100%
        );
}


/* SUN */

.sun {
    position: absolute;

    width: 175px;
    height: 175px;

    right: 8%;
    top: 7%;

    border-radius: 50%;

    background: #ffe9a8;

    opacity: .8;

    box-shadow:
        0 0 35px rgba(255,236,170,.8),
        0 0 90px rgba(255,236,170,.45);
}


/* CLOUDS */

.cloud {
    position: absolute;

    width: 210px;
    height: 65px;

    background: rgba(255,255,255,.68);

    border-radius:
        70% 55% 65% 45%;

    filter: blur(.4px);

    opacity: .85;

    z-index: 2;
}

.cloud::before {
    content: "";

    position: absolute;

    width: 85px;
    height: 85px;

    left: 30px;
    bottom: 15px;

    background: rgba(255,255,255,.68);

    border-radius: 50%;
}

.cloud::after {
    content: "";

    position: absolute;

    width: 105px;
    height: 95px;

    right: 28px;
    bottom: 10px;

    background: rgba(255,255,255,.68);

    border-radius: 50%;
}


/* MAIN CLOUDS */

.cloud.one {
    left: 1%;
    top: 10%;
    transform: scale(.9);
    opacity: .68;
}

.cloud.two {
    left: 57%;
    top: 1.3%;
    transform: scale(.58);
    opacity: .65;
}

.cloud.three {
    right: 4%;
    top: 15%;
    transform: scale(.70);
    opacity: .89;
}


/* EXTRA DISTANT CLOUDS */

.cloud.four {
    left: 27%;
    top: 6%;
    transform: scale(.42);
    opacity: .68;
}

.cloud.five {
    right: 8%;
    top: 42%;
    transform: scale(.38);
    opacity: .79;
}


/* NEW DISTANT CLOUDS */

.cloud.six {
    left: 6%;
    top: 49%;
    transform: scale(.36);
    opacity: .65;
}

.cloud.seven {
    left: -2%;
    top: 35%;
    transform: scale(.32);
    opacity: .65;
}


/* NEW CLOUDS - EMPTY SIDE AREAS */

.cloud.eight {
    left: 11%;
    top: 27%;
    transform: scale(.25);
    opacity: .65;
}

.cloud.nine {
    right: -2%;
    top: 32%;
    transform: scale(.23);
    opacity: .70;
}

.cloud.ten {
    right: -1%;
    top: 50%;
    transform: scale(.18);
    opacity: .80;
}


/* =========================
   HILLS
========================= */

.hill {
    position: absolute;
    bottom: -40px;

    border-radius: 50% 50% 0 0;
}

.hill.back {
    width: 75%;
    height: 270px;

    left: -15%;

    background: #9bcea8;

    opacity: .7;
}

.hill.back.right {
    left: auto;
    right: -20%;

    width: 70%;
    height: 240px;
}

.hill.front {
    width: 100%;
    height: 180px;

    left: 0;

    background: #75b78a;

    z-index: 1;
}


/* =========================
   DISTANT HILL TREES
========================= */

.distant-tree {
    position: absolute;

    width: 34px;
    height: 58px;

    z-index: 3;

    opacity: .52;
}

.distant-tree::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 42px;
    height: 42px;

    background: #6fa982;

    border-radius: 50% 50% 45% 45%;
}

.distant-tree::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 9px;
    height: 28px;

    background: #78967d;

    border-radius: 5px;
}


/* LEFT DISTANT TREES */

.distant-tree.t1 {
    left: 1%;
    bottom: 80px;
    transform: scale(.58);
}

.distant-tree.t2 {

    bottom: 120px;
    transform: scale(.45);
}

.distant-tree.t3 {

    transform: scale(.52);
}

}

.distant-tree.t8 {

    bottom: 185px;

/* RIGHT DISTANT TREES */

}

.distant-tree.t5 {
    right: 18.4%;
    bottom: 116px;
    transform: scale(.45);

.distant-tree.t6 {

    transform: scale(.52);
}

.distant-tree.t9 {
    right: 11.5%;
    bottom: 105px;
    transform: scale(.48);
}

.distant-tree.t10 {
    right: 12.8%;
    bottom: 157px;
    transform: scale(.40);
}


/* =========================
   TREES ON VISIBLE BACK HILL
========================= */

.hill-tree {
    position: absolute;

    width: 25px;
    height: 48px;

    z-index: 2;

    opacity: .50;
}

.hill-tree::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 34px;
    height: 34px;

    background: #649a76;

    border-radius: 50% 50% 45% 45%;
}

.hill-tree::after {
    content: "";

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

/* LEFT VISIBLE BACK HILL */

.hill-tree.ht1 {

.hill-tree.ht2 {

}

.hill-tree.ht5 {
    right: 16%;

}


/* =========================
   RAIN
========================= */

.rain {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 4;
}

.drop {
    position: absolute;

    width: 2px;
    height: 28px;

    border-radius: 50%;

    background: rgba(255,255,255,.38);

    animation:
        rainFall 3.8s linear infinite;
}

.drop:nth-child(1) {
    left: 8%;
    animation-delay: .2s;
}

.drop:nth-child(2) {
    left: 18%;
    animation-delay: 1.1s;
}

.drop:nth-child(3) {
    left: 30%;
    animation-delay: 2s;
}

.drop:nth-child(4) {
    left: 47%;
    animation-delay: .8s;
}

.drop:nth-child(5) {
    left: 61%;
    animation-delay: 1.7s;
}

.drop:nth-child(6) {
    left: 73%;
    animation-delay: .4s;
}

.drop:nth-child(7) {
    left: 87%;
    animation-delay: 2.4s;
}

.drop:nth-child(8) {
    left: 94%;
    animation-delay: 1.3s;
}

@keyframes rainFall {

    from {
        transform: translateY(-80px);
    }

    to {
        transform: translateY(110vh);
    }

}


/* =========================
   TREES
========================= */

.tree {
    position: absolute;

    bottom: 43px;

    width: 170px;
    height: 245px;

    z-index: 6;

    pointer-events: none;
}

.tree.left {
    left: 1%;
}

.tree.right {
    right: 1%;

    transform: scale(.82);
}


/* TREE TRUNK */

.trunk {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 30px;
    height: 125px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #68482f 0%,
            #805a39 45%,
            #6b4a30 100%
        );

    border-radius:
        18px 14px 10px 12px;

    box-shadow:
        4px 0 0 rgba(80,52,34,.10);
}


/* TREE CROWN */

.tree-crown {
    position: absolute;

    left: 50%;
    top: 7px;

    width: 155px;
    height: 155px;

    transform: translateX(-50%);

    background:
        linear-gradient(
            145deg,
            #68aa72,
            #4d9664
        );

    border-radius:
        48% 55% 44% 58% /
        53% 45% 57% 48%;

    box-shadow:
        inset -15px -12px 18px rgba(38,100,56,.16),
        inset 8px 8px 15px rgba(255,255,255,.08);
}


/* =========================
   TREE LEAVES
========================= */

.tree-leaf {
    position: absolute;

    width: 15px;
    height: 9px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            135deg,
            #75b87a,
            #3f8d5a

    opacity: .95;

    z-index: 10;
}


/* -------- LEFT TREE -------- */

.tree.left .leaf1 {
    left: 42px;
    top: 47px;

    animation:
        leftLeafOne 6s ease-in-out infinite;
}

.tree.left .leaf2 {
    left: 76px;
    top: 62px;

    animation:
        leftLeafTwo 7s ease-in-out infinite;

    animation-delay: 1.5s;
}

.tree.left .leaf3 {
    left: 103px;
    top: 78px;

    animation:

    animation-delay: 3s;
}


/* EXTRA LEFT LEAVES */

}


/* -------- RIGHT TREE -------- */

        rightLeafOne 6.4s ease-in-out infinite;
}

.tree.right .leaf2 {

        rightLeafThree 6.7s ease-in-out infinite;

    animation-delay: 2.7s;
}


/* EXTRA RIGHT LEAVES */

    top: 94px;

    animation:
        rightLeafFour 7.3s ease-in-out infinite;

}

.tree.right .leaf5 {

        rightLeafFive 6.9s ease-in-out infinite;

.tree.right .leaf6 {

        rightLeafSix 7.6s ease-in-out infinite;

    animation-delay: 3.8s;
}

/* =========================
   MAIN WHITE CARD
========================= */

.container {
    position: relative;

    width: 100%;
    max-width: 850px;

    min-height: 565px;

    padding:
        20px 30px 35px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        rgba(255,255,255,.88);

    backdrop-filter: blur(12px);

    border:
        1px solid rgba(255,255,255,.78);

    border-radius: 30px;

    box-shadow:
        0 20px 55px rgba(44,91,76,.20),
        inset 0 1px 0 rgba(255,255,255,.8);

    overflow: hidden;

    z-index: 20;
}

/* =========================
   CONTENT
========================= */

.container > .emoji,
.container > h1,
.container > .subtitle,
.container > .buttons,
.container > .footer-message,
.container > .footer {

    position: relative;

    top: -18px;

    z-index: 3;
}


.emoji {
    font-size: 52px;

    margin-bottom: 2px;

    filter:
        drop-shadow(
            0 5px 4px rgba(0,0,0,.08)
        );
}


h1 {
    margin: 0;

    color: #65458f;

    font-size: 42px;

    line-height: 1.15;

    font-weight: 700;
}


.subtitle {
    margin:
        13px auto 30px;

    max-width: 570px;

    color: #59706a;

    font-size: 18px;

    line-height: 1.5;

    font-weight: 700;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    gap: 28px;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;
}


.main-button {
    width: 280px;

    min-height: 175px;

    position: relative;

    overflow: hidden;

    border: none;

    border-radius: 27px;

    text-decoration: none;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.main-button:hover {
    transform:
        translateY(-7px);
}


.read {
    background:
        linear-gradient(
            145deg,
            #ead9fc,
            #d8c0f3
        );

    color: #65458f;

    box-shadow:
        0 12px 25px rgba(101,69,143,.20),
        inset 0 1px 0 rgba(255,255,255,.7);
}


.color {
    background:
        linear-gradient(
            145deg,
            #d9f3df,
            #bde4ca
        );

    color: #2d6a4f;

    box-shadow:
        0 12px 25px rgba(45,106,79,.18),
        inset 0 1px 0 rgba(255,255,255,.7);
}


/* =====================================================
   💜💚 CARD BUBBLES
   ===================================================== */

.button-bubble {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.95) 0 6%,
            rgba(255,255,255,.35) 7% 13%,
            transparent 14%
        ),
        radial-gradient(
            circle at 65% 70%,
            rgba(255,255,255,.12),
            transparent 58%
        );

    border: 2px solid rgba(255,255,255,.52);

    box-shadow:
        inset 5px 5px 10px rgba(255,255,255,.45),
        inset -7px -7px 12px rgba(90,55,130,.13),
        0 3px 8px rgba(0,0,0,.06);
}
